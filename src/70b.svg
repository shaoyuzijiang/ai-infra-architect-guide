<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="70B 部署显存账分解">
  <style>
    .lbl{font-size:12.5px;fill:var(--fg)}.sub{font-size:10.5px;fill:var(--muted)}.tag{font-size:10.5px;fill:var(--accent)}
    .rb{fill:var(--surface);stroke:var(--border);stroke-width:1}.rv{fill:var(--surface);stroke:var(--accent);stroke-width:1.2}
    .wb{fill:none;stroke:var(--warning);stroke-width:1.2;stroke-dasharray:4 3}
    .ab{stroke:var(--muted);fill:none;stroke-width:1}.aw{stroke:var(--accent);fill:none;stroke-width:1.2}
  </style>
  <defs>
    <marker id="e70" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker>
  </defs>

  <text x="16" y="40" class="lbl">70B · BF16 · 8K 上下文 · 16 并发：显存账三行</text>

  <rect x="16" y="56" width="240" height="40" rx="6" class="rv"/>
  <text x="30" y="74" class="sub">权重</text>
  <text x="30" y="88" class="sub">70B × 2B = 140GB</text>
  <rect x="266" y="56" width="240" height="40" rx="6" class="wb"/>
  <text x="280" y="74" class="sub">KV：320KiB/Token × 8K × 16 路</text>
  <text x="280" y="88" class="sub">≈ 42GB —— 并发上限的真瓶颈</text>
  <rect x="516" y="56" width="228" height="40" rx="6" class="rv"/>
  <text x="530" y="74" class="sub">激活 + 框架开销</text>
  <text x="530" y="88" class="sub">Logits 622MiB 级 + 数百 MiB</text>

  <path d="M256 76 H 264" class="ab" marker-end="url(#e70)"/>
  <path d="M506 76 H 514" class="ab" marker-end="url(#e70)"/>

  <text x="16" y="128" class="sub">合计 ≥ 188GB → 单卡不存在，方案是组队：</text>

  <rect x="16" y="142" width="220" height="44" rx="6" class="rv"/>
  <text x="30" y="160" class="sub">2× H20-96G（TP=2）</text>
  <text x="30" y="176" class="sub">权重 70G/卡，KV 余量大</text>
  <rect x="256" y="142" width="200" height="44" rx="6" class="rv"/>
  <text x="270" y="160" class="sub">4× A800/H800-80G</text>
  <text x="270" y="176" class="sub">TP=4，老集群复用</text>
  <rect x="476" y="142" width="130" height="44" rx="6" class="rb"/>
  <text x="490" y="160" class="sub">FP8 单卡 H20</text>
  <text x="490" y="176" class="sub">70G+余量顶格</text>
  <rect x="626" y="142" width="118" height="44" rx="6" class="rb"/>
  <text x="640" y="160" class="sub">W4 量化</text>
  <text x="640" y="176" class="sub">≈35–40G 即可</text>

  <text x="16" y="222" class="tag">整除校验：64Q/8KV 头 → TP=2/4/8 均可切（ch36 约束）</text>
</svg>
