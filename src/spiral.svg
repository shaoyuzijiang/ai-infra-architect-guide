<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="续集图：neocloud 信用死亡螺旋与全链重估">
  <style>
    .st{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .tx{font-size:11px;fill:var(--fg)}.txs{font-size:9.5px;fill:var(--muted)}
    .ab{stroke:var(--muted);fill:none;stroke-width:1;marker-end:url(#ps)}
    .w{fill:var(--surface);stroke:var(--warning);stroke-width:1.2;stroke-dasharray:4 3}
    .tag{font-size:10.5px;fill:var(--accent)}
  </style>
  <defs>
    <marker id="ps" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker>
  </defs>

  <!-- 起点 -->
  <g>
    <rect x="60" y="20" width="180" height="56" rx="6" class="st"/>
    <text x="150" y="43" text-anchor="middle" class="tx">AI 债务规模巨大</text>
    <text x="150" y="60" text-anchor="middle" class="txs">“≈ 政府赤字七成”是量级修辞</text>
  </g>
  <path class="ab" d="M240 42 L290 42"/>

  <!-- 环 ① -->
  <g>
    <rect x="290" y="20" width="180" height="56" rx="6" class="st"/>
    <text x="380" y="43" text-anchor="middle" class="tx">① 新债利率飙升</text>
    <text x="380" y="60" text-anchor="middle" class="txs">CoreWeave 2032 年债 15%</text>
  </g>
  <!-- ① → ② -->
  <path class="ab" d="M470 44 L650 44 L650 120"/>
  <!-- 环 ② -->
  <g>
    <rect x="560" y="120" width="180" height="56" rx="6" class="st"/>
    <text x="650" y="143" text-anchor="middle" class="tx">② 扩张算不过账</text>
    <text x="650" y="160" text-anchor="middle" class="txs">借卡转租的收入盖不住利息</text>
  </g>
  <!-- ② → ③ -->
  <path class="ab" d="M650 176 L650 210 L380 210 L380 240"/>
  <!-- 环 ③ -->
  <g>
    <rect x="290" y="240" width="180" height="56" rx="6" class="st"/>
    <text x="380" y="263" text-anchor="middle" class="tx">③ 违约概率被重估</text>
    <text x="380" y="280" text-anchor="middle" class="txs">CDS ≈ 1,082bp「困境级」</text>
  </g>
  <!-- ③ → ④ -->
  <path class="ab" d="M290 268 L150 268 L150 176"/>
  <!-- 环 ④ -->
  <g>
    <rect x="60" y="120" width="180" height="56" rx="6" class="st"/>
    <text x="150" y="143" text-anchor="middle" class="tx">④ 融资更贵/更难</text>
    <text x="150" y="160" text-anchor="middle" class="txs">回到 ① —— 螺旋收紧</text>
  </g>
  <path class="ab" d="M96 120 L96 8 L380 8 L380 20"/>

  <!-- ③ → 对外传导 -->
  <path class="ab" d="M470 268 L560 268"/>
  <g>
    <rect x="560" y="240" width="180" height="56" rx="6" class="w"/>
    <text x="650" y="263" text-anchor="middle" class="tx">链上供应商全新定价</text>
    <text x="650" y="280" text-anchor="middle" class="txs">Bloom 4.3 亿 · 光模块 · 液冷</text>
  </g>

  <text x="380" y="316" text-anchor="middle" class="tag">四个环节首尾相接、互为放大 —— 这就是「顺着逻辑推」能推出来的下跌理由</text>
</svg>
