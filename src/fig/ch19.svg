<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="ch19 原理图解：全局 Shuffle 顺序切块 vs 窗口内按长度分桶">
  <defs><marker id="a19v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker><marker id="a19m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>
  <text x="16" y="70" class="lbl" fill="var(--muted)">baseline</text>
  <rect x="110" y="42" width="180" height="44" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="200" y="69" class="lbl" text-anchor="middle" fill="var(--muted)">全局 Shuffle</text>
  <rect x="350" y="42" width="170" height="44" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="435" y="69" class="lbl" text-anchor="middle" fill="var(--muted)">顺序切块</text>
  <rect x="580" y="42" width="150" height="44" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="655" y="69" class="sub" text-anchor="middle" fill="var(--muted)">长短混杂·Padding 多</text>
  <text x="16" y="168" class="lbl" fill="var(--accent)">variant</text>
  <rect x="110" y="130" width="180" height="44" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="200" y="157" class="lbl" text-anchor="middle" fill="var(--muted)">同一随机排列</text>
  <rect x="350" y="130" width="170" height="44" rx="6" fill="var(--surface)" stroke="var(--warning)" stroke-dasharray="4 3"/>
  <text x="435" y="150" class="tag" text-anchor="middle" fill="var(--warning)">窗口内按长度排序</text>
  <text x="435" y="166" class="sub" text-anchor="middle" fill="var(--muted)">window 整除 batch</text>
  <rect x="580" y="130" width="150" height="44" rx="6" fill="var(--surface)" stroke="var(--accent)"/>
  <text x="655" y="150" class="lbl" text-anchor="middle" fill="var(--fg)">Padding 少</text>
  <text x="655" y="166" class="sub" text-anchor="middle" fill="var(--muted)">共现重复率升</text>
  <path d="M290,64 L344,64" marker-end="url(#a19m)" stroke="var(--muted)" fill="none"/>
  <path d="M520,64 L574,64" marker-end="url(#a19m)" stroke="var(--muted)" fill="none"/>
  <path d="M290,152 L344,152" marker-end="url(#a19v)" stroke="var(--muted)" fill="none"/>
  <path d="M520,152 L574,152" marker-end="url(#a19v)" stroke="var(--muted)" fill="none"/>
  <text x="200" y="200" class="sub" fill="var(--muted)">窗口大小 = 随机性换算力的旋钮</text>
</svg>
