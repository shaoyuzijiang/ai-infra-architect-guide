<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="ch25 原理图解：存全部激活 vs 存层输入+RNG 重算">
  <defs><marker id="a25v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker><marker id="a25m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>
  <text x="16" y="70" class="lbl" fill="var(--muted)">baseline</text>
  <rect x="110" y="42" width="200" height="44" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="210" y="69" class="lbl" text-anchor="middle" fill="var(--muted)">保存全部层内激活</text>
  <rect x="380" y="42" width="180" height="44" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="470" y="69" class="lbl" text-anchor="middle" fill="var(--muted)">Backward 直接用</text>
  <text x="16" y="168" class="lbl" fill="var(--accent)">variant</text>
  <rect x="110" y="130" width="190" height="44" rx="6" fill="var(--surface)" stroke="var(--accent)"/>
  <text x="205" y="150" class="lbl" text-anchor="middle" fill="var(--fg)">只存段输入+RNG</text>
  <text x="205" y="166" class="sub" text-anchor="middle" fill="var(--muted)">段数 1/2/4/…/28</text>
  <rect x="370" y="130" width="160" height="44" rx="6" fill="var(--surface)" stroke="var(--warning)" stroke-dasharray="4 3"/>
  <text x="450" y="150" class="tag" text-anchor="middle" fill="var(--warning)">Backward 前重算</text>
  <text x="450" y="166" class="sub" text-anchor="middle" fill="var(--muted)">≈多一次前向</text>
  <rect x="600" y="130" width="100" height="44" rx="6" fill="var(--surface)" stroke="var(--accent)"/>
  <text x="650" y="157" class="lbl" text-anchor="middle" fill="var(--fg)">反传</text>
  <path d="M310,64 L374,64" marker-end="url(#a25m)" stroke="var(--muted)" fill="none"/>
  <path d="M300,152 L364,152" marker-end="url(#a25v)" stroke="var(--muted)" fill="none"/>
  <path d="M530,152 L594,152" marker-end="url(#a25v)" stroke="var(--muted)" fill="none"/>
  <text x="380" y="200" class="sub" fill="var(--muted)">激活显存 ⇄ 重算时间的定价表</text>
</svg>
