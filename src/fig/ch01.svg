<svg viewBox="0 0 760 235" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ch01 原理图解：接龙循环——Decode 每步重算全部历史">
  <style>
    .lbl{font-size:12.5px;fill:var(--fg)}.sub{font-size:10.5px;fill:var(--muted)}.tag{font-size:10.5px;fill:var(--accent)}
    .rb{fill:var(--surface);stroke:var(--border);stroke-width:1}.rv{fill:var(--surface);stroke:var(--accent);stroke-width:1.2}
    .wb{fill:none;stroke:var(--warning);stroke-width:1.2;stroke-dasharray:4 3}
    .ab{stroke:var(--muted);fill:none;stroke-width:1}.aw{stroke:var(--accent);fill:none;stroke-width:1.2}
  </style>
  <defs>
    <marker id="a01" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker>
    <marker id="a01v" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker>
  </defs>

  <text x="16" y="60" class="sub">baseline</text>
  <text x="16" y="74" class="sub">本章实现</text>
  <rect x="84" y="44" width="120" height="34" rx="6" class="rb"/>
  <text x="144" y="65" text-anchor="middle" class="sub">19 Token 输入</text>
  <path d="M204 61 H 226" class="ab" marker-end="url(#a01)"/>
  <rect x="230" y="44" width="118" height="34" rx="6" class="rb"/>
  <text x="289" y="61" text-anchor="middle" class="sub">Prefill 读完</text>
  <text x="289" y="74" text-anchor="middle" class="sub" fill="var(--accent)">34.43ms</text>
  <path d="M348 61 H 370" class="ab" marker-end="url(#a01)"/>
  <rect x="374" y="40" width="196" height="42" rx="6" class="wb"/>
  <text x="472" y="57" text-anchor="middle" class="sub">写 1 个字 = 重算</text>
  <text x="472" y="70" text-anchor="middle" class="sub">全部历史 33.40ms</text>
  <path d="M570 61 H 592" class="ab" marker-end="url(#a01)"/>
  <text x="600" y="65" class="sub">历史越长</text>
  <text x="600" y="78" class="sub">每步越贵</text>
  <path d="M472 82 L 398 104" class="ab" marker-end="url(#a01)"/>
  <text x="435" y="100" class="sub">循环 ×32 次</text>

  <text x="16" y="146" class="tag">ch02 预告</text>
  <rect x="84" y="128" width="120" height="34" rx="6" class="rv"/>
  <text x="144" y="149" text-anchor="middle" class="sub">存历史 K/V</text>
  <path d="M204 145 H 226" class="aw" marker-end="url(#a01v)"/>
  <rect x="230" y="128" width="150" height="34" rx="6" class="rv"/>
  <text x="305" y="149" text-anchor="middle" class="sub">只算新 Token</text>
  <path d="M380 145 H 402" class="aw" marker-end="url(#a01v)"/>
  <text x="410" y="149" class="sub">每步成本不再随历史增长 → 上下文长才见收益</text>
</svg>
