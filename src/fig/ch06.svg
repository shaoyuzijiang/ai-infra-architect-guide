<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="ch06 原理图解：每轮调度三拍 与 Prefill/Decode 交替时间线">
<style>
.lbl{font-size:12.5px;fill:var(--fg)}.sub{font-size:10.5px;fill:var(--muted)}.tag{font-size:10.5px;fill:var(--accent)}
.rb{fill:var(--surface);stroke:var(--border);stroke-width:1}.rv{fill:var(--surface);stroke:var(--accent);stroke-width:1.2}
.wb{fill:none;stroke:var(--warning);stroke-width:1.2;stroke-dasharray:4 3}
.ab{stroke:var(--muted);fill:none;stroke-width:1}.aw{stroke:var(--accent);fill:none;stroke-width:1.2}
</style>
<defs>
<marker id="m06" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker>
<marker id="mv06" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker>
</defs>
<text x="16" y="30" class="lbl">面板一：每轮迭代前，调度器的三拍</text>

<rect x="16" y="44" width="212" height="50" rx="6" class="rv"/>
<text x="122" y="64" text-anchor="middle" class="sub">① 算预算</text>
<text x="122" y="78" text-anchor="middle" class="sub">prefill_cost = batch×最长Prompt</text>
<path d="M228 69 H 246" class="aw" marker-end="url(#mv06)"/>
<rect x="250" y="44" width="212" height="50" rx="6" class="rv"/>
<text x="356" y="64" text-anchor="middle" class="sub">② FCFS 准入</text>
<text x="356" y="78" text-anchor="middle" class="sub">队头装满本轮，不够即停、不跳队头</text>
<path d="M462 69 H 480" class="aw" marker-end="url(#mv06)"/>
<rect x="484" y="44" width="230" height="50" rx="6" class="rv"/>
<text x="599" y="64" text-anchor="middle" class="sub">③ Decode 保护</text>
<text x="599" y="78" text-anchor="middle" class="sub">两轮 Prefill 之间必插一轮 Decode</text>

<rect x="16" y="112" width="698" height="42" rx="6" class="wb"/>
<text x="24" y="130" class="sub">baseline（Prefill 优先）：突发时连续多轮 Prefill → 正在生成的会话 Decode 停摆，最大 ITL 达 906.84ms</text>
<text x="24" y="144" class="sub">软预算：队头单条 Prompt 超预算不拆分、整条放行，否则 FCFS 队头被永久跳过</text>

<text x="16" y="192" class="lbl">面板二：两阶段时间线——每轮算几个位置 × 读多少历史</text>

<text x="16" y="216" class="sub">Prefill 轮</text>
<rect x="110" y="202" width="300" height="26" rx="6" class="rv"/>
<text x="260" y="219" text-anchor="middle" class="sub">批内每条并行算全部 Prompt 位置（按矩形补齐扣账）</text>
<text x="420" y="219" class="tag">建 Cache、出首 Token</text>

<text x="16" y="248" class="sub">Decode 轮</text>
<rect x="110" y="234" width="220" height="26" rx="6" class="rv"/>
<text x="220" y="251" text-anchor="middle" class="sub">每请求只算 1 个新位置</text>
<rect x="340" y="234" width="220" height="26" rx="6" class="wb"/>
<text x="450" y="251" text-anchor="middle" class="sub">读各自全部历史 K/V</text>
<text x="572" y="251" class="sub">→ 写字</text>

<text x="16" y="284" class="sub">混合节奏</text>
<rect x="110" y="270" width="96" height="26" rx="6" class="rv"/>
<text x="158" y="287" text-anchor="middle" class="sub">Prefill</text>
<rect x="216" y="270" width="76" height="26" rx="6" class="wb"/>
<text x="254" y="287" text-anchor="middle" class="sub">Decode</text>
<rect x="302" y="270" width="96" height="26" rx="6" class="rv"/>
<text x="350" y="287" text-anchor="middle" class="sub">Prefill</text>
<rect x="408" y="270" width="76" height="26" rx="6" class="wb"/>
<text x="446" y="287" text-anchor="middle" class="sub">Decode</text>
<text x="498" y="287" class="sub">→ 交替，不再饿停</text>

<text x="16" y="320" class="tag">最大停顿降 58.5%，但停顿次数变多、p95 反升——是延迟再分配，不是全面改善</text>
</svg>
