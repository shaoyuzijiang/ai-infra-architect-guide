<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="ch04 原理图解：迭代前三拍与 Prefill 干扰 Decode 时间线">
<style>
.lbl{font-size:12.5px;fill:var(--fg)}.sub{font-size:10.5px;fill:var(--muted)}.tag{font-size:10.5px;fill:var(--accent)}
.rb{fill:var(--surface);stroke:var(--border);stroke-width:1}.rv{fill:var(--surface);stroke:var(--accent);stroke-width:1.2}
.wb{fill:none;stroke:var(--warning);stroke-dasharray:4 3}.wf{fill:var(--warning);opacity:0.18}
.ab{stroke:var(--muted);fill:none;stroke-width:1}.aw{stroke:var(--accent);fill:none;stroke-width:1.2}
</style>
<defs>
<marker id="m04" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker>
<marker id="mv04" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker>
</defs>
<text x="16" y="24" class="tag">机制：每次迭代前固定三拍</text>
<rect x="84" y="36" width="160" height="38" rx="6" class="rv"/>
<text x="164" y="60" text-anchor="middle" class="lbl">① 回收完成槽</text>
<path d="M244 55 H 254" class="aw" marker-end="url(#mv04)"/>
<rect x="258" y="36" width="160" height="38" rx="6" class="rv"/>
<text x="338" y="60" text-anchor="middle" class="lbl">② FCFS 填补</text>
<path d="M418 55 H 428" class="aw" marker-end="url(#mv04)"/>
<text x="423" y="48" text-anchor="middle" class="sub">waiting 入座</text>
<rect x="432" y="36" width="180" height="38" rx="6" class="rv"/>
<text x="522" y="54" text-anchor="middle" class="lbl">③ Prefill 或 Decode</text>
<text x="522" y="68" text-anchor="middle" class="sub">有新请求则 Prefill</text>
<path d="M522 74 V 96 H 164 V 78" class="aw" marker-end="url(#mv04)"/>
<text x="343" y="94" text-anchor="middle" class="sub">下一迭代再循环</text>
<text x="16" y="150" class="tag">时间线：Prefill 插进 Decode 流</text>
<text x="60" y="184" text-anchor="end" class="sub">固定批次</text>
<rect x="72" y="170" width="150" height="22" rx="6" class="rb"/>
<text x="147" y="185" text-anchor="middle" class="sub">整批 Prefill</text>
<rect x="226" y="170" width="392" height="22" rx="6" class="rb"/>
<text x="422" y="185" text-anchor="middle" class="sub">32 轮 Decode·空槽照跑</text>
<text x="632" y="185" class="sub">TTFT 1511ms</text>
<text x="60" y="222" text-anchor="end" class="sub">连续批</text>
<rect x="72" y="208" width="150" height="22" rx="6" class="rv"/>
<text x="147" y="223" text-anchor="middle" class="sub">Prefill</text>
<rect x="226" y="208" width="120" height="22" rx="6" class="rv"/>
<text x="286" y="223" text-anchor="middle" class="sub">Decode</text>
<rect x="350" y="208" width="110" height="22" rx="6" class="rv"/>
<text x="405" y="223" text-anchor="middle" class="sub">换槽+Prefill</text>
<rect x="464" y="208" width="154" height="22" rx="6" class="rv"/>
<text x="541" y="223" text-anchor="middle" class="sub">Decode 续</text>
<text x="632" y="223" class="sub">TTFT 205ms</text>
<rect x="346" y="203" width="118" height="32" rx="6" class="wb"/>
<text x="72" y="262" class="sub">512 Token 的 Prefill = 大算撞上别人的 Decode：</text>
<text x="72" y="280" class="sub">ITL 尖峰 35.07 → 72.71 ms，p95 却只有 34.89 会掩盖它</text>
<rect x="470" y="246" width="148" height="22" rx="6" class="wf"/>
<text x="544" y="262" text-anchor="middle" class="sub">ITL p95 恶化</text>
<text x="544" y="277" text-anchor="middle" class="sub">36.50→71.48 ms</text>
<text x="72" y="312" class="tag">槽位有效率 62.50%→74.07%</text>
<text x="692" y="312" text-anchor="end" class="sub">等长负载只差 0.4%</text>
</svg>
